[package]
name = "urnasol"
version = "0.1.0"
description = "UrnaSol: Sistema de Votacao Eletronica Auditavel e Offline na Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "urnasol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "1.18.26"
bytemuck = "1.16.0"
thiserror = "1.0"
